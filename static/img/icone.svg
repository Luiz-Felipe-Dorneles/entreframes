<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ícone do EntreFrames: um pedaço de filme com dois quadros (frames)
       e um "play" vermelho bem no meio, entre eles. -->
  <rect width="64" height="64" rx="14" fill="#0b0a10"/>
  <!-- a fita de filme (amarela) -->
  <rect x="5" y="13" width="54" height="38" rx="4" fill="#f5c518"/>
  <!-- furinhos da fita, em cima e embaixo -->
  <g fill="#0b0a10">
    <rect x="9" y="16" width="5" height="5" rx="1"/><rect x="19" y="16" width="5" height="5" rx="1"/>
    <rect x="29.5" y="16" width="5" height="5" rx="1"/><rect x="40" y="16" width="5" height="5" rx="1"/>
    <rect x="50" y="16" width="5" height="5" rx="1"/>
    <rect x="9" y="43" width="5" height="5" rx="1"/><rect x="19" y="43" width="5" height="5" rx="1"/>
    <rect x="29.5" y="43" width="5" height="5" rx="1"/><rect x="40" y="43" width="5" height="5" rx="1"/>
    <rect x="50" y="43" width="5" height="5" rx="1"/>
  </g>
  <!-- os dois quadros do filme -->
  <rect x="9" y="24" width="20" height="16" rx="2" fill="#1e1b28"/>
  <rect x="35" y="24" width="20" height="16" rx="2" fill="#1e1b28"/>
  <!-- o play, "entre os frames" -->
  <path d="M26 22.5 L42 32 L26 41.5 Z" fill="#c8102e" stroke="#0b0a10" stroke-width="2" stroke-linejoin="round"/>
</svg>
